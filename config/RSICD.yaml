######################## general settings ########################
local_rank: 0
name: irra
output_dir: logs
log_period: 100
eval_period: 1
patience: 15
val_dataset: val
resume: false
resume_ckpt_file: ""

######################## model general settings ########################
pretrain_choice: ViT-B/16
temperature: 0.02
img_aug: true

cmt_depth: 4
masked_token_rate: 0.8
masked_token_unchanged_rate: 0.1
lr_factor: 5.0
MLM: true

######################## loss settings ########################
loss_names: sdm+mlm+ot
sdm_loss_weight: 1.0
mlm_loss_weight: 1.0
amlm_loss_weight: 0.5
keyword_file: data/RSICD_keyword_512_refined.txt
amlm_keyword_mask_ratio: 0.5
id_loss_weight: 1.0
ot_loss_weight: 1.0
ot_hid_dim: 512
ot_num_dustbins: 8
ot_sinkhorn_eps: 0.1
ot_sinkhorn_iters: 20
ot_k_candidates: 50
ot_eval_batch_size: 128
ot_num_hard_negatives: 3
ot_gate_init: 0.1

######################## vision transformer settings ########################
img_size: [224, 224]
stride_size: 16

######################## text transformer settings ########################
text_length: 77
vocab_size: 49408

######################## solver ########################
optimizer: Adam
lr: 1.0e-5
bias_lr_factor: 2.0
momentum: 0.9
weight_decay: 4.0e-5
weight_decay_bias: 0.0
alpha: 0.9
beta: 0.999

######################## scheduler ########################
num_epoch: 60
milestones: [20, 50]
gamma: 0.1
warmup_factor: 0.1
warmup_epochs: 5
warmup_method: linear
lrscheduler: cosine
target_lr: 0
power: 0.9

######################## dataset ########################
dataset_name: RSICD
sampler: random
num_instance: 4
root_dir: /home/coco/datasets
batch_size: 64
test_batch_size: 512
num_workers: 8
training: true
